<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>User database</title>
  <style>
    :root {
      --ink: #e8e6e1;
      --paper: #17181a;
      --line: #3a3b3e;
      --panel: #0d0e10;
      --teal: #4fb3a6;
      --gold: #d4ab55;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090a0c;
      color: var(--ink);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .app-container {
      position: relative;
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    h2 {
      font-family: Arial, sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--teal);
      margin-bottom: 18px;
      font-size: 1rem;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 24px;
    }

    form label {
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      white-space: nowrap;
    }

    input[type="text"] {
      background: #141618;
      border: 1px solid #2e3033;
      color: var(--ink);
      padding: 12px 14px;
      border-radius: 8px;
      min-width: 150px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    input[type="submit"], button {
      background: var(--teal);
      color: var(--paper);
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      letter-spacing: 0.5px;
      font-size: 0.95rem;
    }

    input[type="submit"]:hover,
    button:hover {
      background: var(--gold);
      transform: translateY(-1px);
    }

    #statusMessage {
      margin: 16px auto;
      padding: 12px 14px;
      width: fit-content;
      background: rgba(30, 40, 47, 0.96);
      border: 1px solid #2f3236;
      border-radius: 10px;
      opacity: 1;
      transition: opacity 0.5s ease;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.3);
    }

    #tableContainer {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    table {
      width: 100%;
      max-width: 760px;
      border-collapse: collapse;
      border: 1px solid var(--line);
      background: var(--panel);
    }

    th, td {
      padding: 12px 14px;
      border: 1px solid var(--line);
      text-align: center;
    }

    th {
      background: #232427;
      color: var(--teal);
      font-family: Arial, sans-serif;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.82rem;
    }

    td {
      background: #0f1113;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
    }

    td button {
      width: 100%;
      background: #212427;
      color: var(--ink);
      border: 1px solid #2f3236;
    }

    #statusMessage {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10;
      width: auto;
      max-width: 280px;
      margin: 0;
      background: rgba(20, 30, 42, 0.98);
      color: var(--ink);
      border: 1px solid #2f3236;
      border-radius: 12px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.35);
      padding: 12px 14px;
    }

    @media (max-width: 640px) {
      form {
        flex-direction: column;
        align-items: stretch;
      }

      input[type="text"], input[type="submit"], button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="app-container">

<h2>User database</h2>

<form id="userForm">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" placeholder="Name">
  <label for="age">Age:</label>
  <input type="text" id="age" name="age" placeholder="Age">
  <input type="submit" value="Submit">
</form>

<div id="statusMessage" style="display:none;"></div>

<h2>Users</h2>
<div id="tableContainer"></div>

<script>
  const form = document.getElementById('userForm');
  const statusMessage = document.getElementById('statusMessage');
  const tableContainer = document.getElementById('tableContainer');

  async function loadTable() {
    const response = await fetch('in.php?ajax=1');
    const data = await response.json();
    renderTable(data.rows);
  }

  function renderTable(rows) {
    let html = '<table><tr><th>ID</th><th>Name</th><th>Age</th><th>Status</th><th>Action</th></tr>';

    if (rows.length === 0) {
      html += '<tr><td colspan="5">No records found.</td></tr>';
    } else {
      for (const row of rows) {
        html += '<tr>' +
                '<td>' + row.id + '</td>' +
                '<td>' + row.name + '</td>' +
                '<td>' + row.age + '</td>' +
                '<td>' + row.status + '</td>' +
                '<td><button type="button" onclick="toggleStatus(' + row.id + ')">Toggle</button></td>' +
                '</tr>';
      }
    }

    html += '</table>';
    tableContainer.innerHTML = html;
  }

  function showMessage(text) {
    statusMessage.style.opacity = '1';
    statusMessage.style.display = 'block';
    statusMessage.textContent = text;
    setTimeout(() => {
      statusMessage.style.opacity = '0';
      setTimeout(() => { statusMessage.style.display = 'none'; }, 500);
    }, 3000);
  }

  async function toggleStatus(id) {
    const response = await fetch('in.php?ajax=1&toggle_id=' + encodeURIComponent(id));
    const data = await response.json();
    if (data.message) {
      showMessage(data.message);
    }
    renderTable(data.rows);
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const name = document.getElementById('name').value.trim();
    const age = document.getElementById('age').value.trim();

    const response = await fetch('in.php?ajax=1&name=' + encodeURIComponent(name) + '&age=' + encodeURIComponent(age));
    const data = await response.json();

    if (data.message) {
      showMessage(data.message);
    }

    if (name !== '' && age !== '') {
      document.getElementById('name').value = '';
      document.getElementById('age').value = '';
    }

    renderTable(data.rows);
  });

  loadTable();
</script>
</div>
</body>
</html>
